version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only versions out for 7 days or more: a broken or hijacked release is usually pulled by then.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    # Wait for the first point release (x.y.1) that often follows a new Rust version.
    cooldown:
      default-days: 7
