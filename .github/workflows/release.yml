name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # rustup comes with the runner: no third-party action to install Rust.
      # The version and components come from rust-toolchain.toml (Dependabot updates it).
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Apple Silicon runners cross-compile the Intel target with -arch;
          # GitHub is retiring the Intel (macos-13) runners.
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      # rustup comes with the runner: no third-party action to install Rust.
      # The version and components come from rust-toolchain.toml (Dependabot updates it).
      - name: Install Rust
        run: rustup toolchain install
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          dist="rbx-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/rbx" "$dist"/
          cp README.md README.ja.md LICENSE "$dist"/
          tar czf "$dist.tar.gz" "$dist"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: rbx-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
